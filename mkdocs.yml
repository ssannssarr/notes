site_name: CITK NOTES HUB
site_url: https://ssannssarr.github.io/notes/
site_author: s
repo_nane: ssannssarr/notes
repo_url: https://github.com/ssannssarr/notes/

theme:
    name: material
    features:
        - search.suggest
        - search.highlight
        - search.share
        - navigation.instant
        #- navigation.sections
        #- navigation.expand
        - navigation.instant.progress
        - navigation.tabs
        - navigation.path
        - navigation.top
        
    custom_dir: overrides
    icon:
      logo: material/library-outline
      repo: simple/git
    palette:
        
        - media: "(prefers-color-scheme)"
          toggle:
            icon: material/link
            name: Switch to light mode
        
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: black
          accent: amber
          toggle:
            icon: material/toggle-switch
            name: Switch to dark mode
            
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: black
          accent: amber
          toggle: 
            icon: material/toggle-switch-off-outline
            name: Switch to light mode

plugins:
    - search:
        lang: en
        

markdown_extensions:
    - attr_list
    - pymdownx.arithmatex:
        generic: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/home.css
  

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/ssannssarr/notes
